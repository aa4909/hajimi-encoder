<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>312寝室-哈基米加密器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .glow-btn {
      transition: all 0.2s ease;
      box-shadow: 0 0 10px #6366f1, 0 0 30px #6366f1;
    }
    .glow-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px #6366f1, 0 0 10px #6366f1;
    }
    .section-anim {
      animation: slideUp 0.8s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-800 min-h-screen flex items-center justify-center px-4 py-10 text-white">

  <div class="w-full max-w-4xl glass rounded-3xl p-6 md:p-10 space-y-8 shadow-2xl section-anim">

    <h1 class="text-4xl md:text-5xl font-extrabold text-center text-indigo-400 tracking-widest">312寝室-哈基米加密器</h1>
    <p class="text-center text-gray-300 text-lg">表面只有“哈基米”，里面可以藏很多字</p>

    <!-- 原文输入 -->
    <div class="section-anim">
      <label class="block text-lg mb-2 text-indigo-200">原文</label>
      <textarea id="inputText" rows="4" class="w-full p-4 bg-black/30 border border-indigo-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none text-white placeholder-gray-400" placeholder="输入需要隐藏的文字..."></textarea>
      <button onclick="encryptText()" class="mt-4 w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl glow-btn">生成隐写文本</button>
    </div>

    <!-- 隐写结果 -->
    <div class="relative section-anim">
      <label class="block text-lg mb-2 text-indigo-200">隐写结果</label>
      <textarea id="encryptedText" rows="2" class="w-full p-4 pr-24 bg-black/20 border border-indigo-400 rounded-xl resize-none text-indigo-200" readonly></textarea>
      <button onclick="copyEncryptedText()" class="absolute top-10 right-4 px-3 py-1.5 bg-indigo-500 hover:bg-indigo-600 text-white text-sm rounded-md glow-btn">复制</button>
      <p id="copyTip" class="text-sm text-green-400 mt-2 hidden">已复制！^_^</p>
    </div>

    <!-- 粘贴隐写文本 -->
    <div class="section-anim">
      <label class="block text-lg mb-2 text-green-200">粘贴隐写文本</label>
      <textarea id="hashText" rows="2" class="w-full p-4 bg-black/30 border border-green-400 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-400 resize-none text-white placeholder-gray-400" placeholder="粘贴看起来只有“哈基米”的文字..."></textarea>
      <button onclick="decryptText()" class="mt-4 w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl glow-btn">提取隐藏内容</button>
    </div>

    <!-- 解密结果 -->
    <div class="section-anim">
      <label class="block text-lg mb-2 text-green-200">隐藏内容</label>
      <textarea id="decryptedText" rows="4" class="w-full p-4 bg-black/20 border border-green-400 rounded-xl resize-none text-green-200" readonly></textarea>
    </div>

    <!-- Footer -->
    <footer class="text-center text-sm text-gray-500 pt-6 border-t border-white/20">
      Made with love by <a href="https://github.com/aa4909" target="_blank" class="text-indigo-400 hover:underline font-semibold">aa4909 on Github</a> · 隐写版
    </footer>
  </div>

  <script>
    // 微信会吞掉 U+200B，所以只用两个能存活的零宽字符做二进制
    const ZERO = '\u200C';
    const ONE = '\u200D';

    // 每个 UTF-16 码元 -> 16 位二进制
    function textToBits(text) {
      const bits = [];
      for (const ch of text) {
        let code = ch.charCodeAt(0);
        for (let i = 15; i >= 0; i--) {
          bits.push((code >> i) & 1);
        }
      }
      return bits;
    }

    function bitsToText(bits) {
      let out = '';
      for (let i = 0; i < bits.length; i += 16) {
        const chunk = bits.slice(i, i + 16);
        if (chunk.length < 16) break;
        let code = 0;
        for (const b of chunk) code = (code << 1) | b;
        out += String.fromCharCode(code);
      }
      return out;
    }

    function extractStegoBits(str) {
      const bits = [];
      for (const ch of str) {
        if (ch === ZERO) bits.push(0);
        else if (ch === ONE) bits.push(1);
      }
      return bits;
    }

    function encryptText() {
      const input = document.getElementById("inputText").value;
      const cover = "哈基米";
      const encrypted = document.getElementById("encryptedText");

      const bits = textToBits(input);
      const hidden = bits.map(b => b ? ONE : ZERO).join('');
      encrypted.value = cover + hidden;

      document.getElementById("copyTip").classList.add("hidden");
    }

    function decryptText() {
      const input = document.getElementById("hashText").value;
      try {
        const bits = extractStegoBits(input);
        if (bits.length === 0) {
          document.getElementById("decryptedText").value = "没检测到零宽隐藏内容。可能是普通文字，或平台已经吞掉了零宽字符。";
          return;
        }
        document.getElementById("decryptedText").value = bitsToText(bits);
      } catch {
        document.getElementById("decryptedText").value = "提取失败，可能是隐写内容不完整。T^T";
      }
    }

    function copyEncryptedText() {
      const encrypted = document.getElementById("encryptedText").value;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(encrypted).then(() => {
          showCopiedTip();
        }).catch(() => {
          fallbackCopy(encrypted);
        });
      } else {
        fallbackCopy(encrypted);
      }
    }

    function fallbackCopy(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      document.body.appendChild(temp);
      temp.style.position = "fixed";
      temp.style.opacity = 0;
      temp.focus();
      temp.select();
      try {
        document.execCommand("copy");
        showCopiedTip();
      } catch (err) {
        alert("复制失败，请手动选中文本。");
      }
      document.body.removeChild(temp);
    }

    function showCopiedTip() {
      const tip = document.getElementById("copyTip");
      tip.classList.remove("hidden");
      setTimeout(() => tip.classList.add("hidden"), 2000);
    }
  </script>
</body>
</html>
